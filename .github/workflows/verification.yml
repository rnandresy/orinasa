# Vérification automatique d'orinasa, à chaque push.
#
# Le build Android ne peut pas tourner sur le poste de développement : Gradle
# n'y démarre pas. C'est donc ce runner qui prouve que l'application compile,
# que les tests unitaires passent et que R8 accepte le build release.
#
# Les deux travaux sont séparés pour qu'un échec dise tout de suite lequel a
# lâché.

name: Vérification

on:
  push:
  workflow_dispatch:

jobs:

  build:
    name: Build debug et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Le dépôt a été créé sous Windows : le bit exécutable de gradlew peut
      # manquer dans git.
      - name: gradlew exécutable
        run: chmod +x gradlew

      # google-services.json est propre à chaque projet Firebase et n'est jamais
      # versionné. Le plugin Gradle en exige un pour construire ; un fichier
      # factice suffit, l'app compilée ici ne se connecte à rien.
      - name: google-services.json factice
        run: cp tools/ci/google-services.factice.json app/google-services.json

      - name: Build debug et tests unitaires
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      # Sans poste capable de lancer les tests, le rapport est le seul moyen de
      # savoir lequel a échoué.
      - name: Rapport des tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orinasa-rapport-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Garder l'APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: orinasa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # `release` active isMinifyEnabled et isShrinkResources. R8 retire ce qu'il
  # croit inutilisé, et Firestore relit les modèles par réflexion : c'est
  # exactement ce qui casse sans prévenir. Ce travail prouve au moins que R8
  # passe ; il ne prouve pas que l'app tourne.
  r8:
    name: Build release (R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew exécutable
        run: chmod +x gradlew

      - name: google-services.json factice
        run: cp tools/ci/google-services.factice.json app/google-services.json

      - name: Build release
        run: ./gradlew --no-daemon assembleRelease
